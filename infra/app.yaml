AWSTemplateFormatVersion: "2010-09-09"
Description: SIS 3 app stack - ECR repository, ECS Fargate service in private subnets behind an ALB

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  NetworkStackName:
    Type: String
    Description: Name of the network stack (its exports are imported)
  MessagingStackName:
    Type: String
    Description: Name of the messaging stack (its exports are imported)
  ImageTag:
    Type: String
    Default: none
    Description: Image tag in ECR. "none" creates the stack with 0 tasks (before the first push).

Mappings:
  Sizing:
    dev:  { Cpu: "256", Memory: "512",  Count: 2 }
    prod: { Cpu: "512", Memory: "1024", Count: 2 }

Conditions:
  HasImage: !Not [!Equals [!Ref ImageTag, none]]

Resources:
  # ---- registry ---------------------------------------------------------------------------------
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "drop untagged images after 1 day",
                "selection": {"tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 1},
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 2,
                "description": "keep the 20 most recent images",
                "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 20},
                "action": {"type": "expire"}
              }
            ]
          }

  # ---- logs -------------------------------------------------------------------------------------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  # ---- security groups --------------------------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public listener of the ALB
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP from the internet }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate tasks, reachable only from the ALB
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSecurityGroup, Description: App port from the ALB only }

  # ---- load balancer ----------------------------------------------------------------------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets:
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-PublicSubnetA" }
        - { "Fn::ImportValue": !Sub "${NetworkStackName}-PublicSubnetB" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId: { "Fn::ImportValue": !Sub "${NetworkStackName}-VpcId" }
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref TargetGroup }

  # ---- two separate roles -----------------------------------------------------------------------
  ExecutionRole:           # used by ECS before the code runs: pull the image, write logs
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:                # used by the application code: it may publish the OrderPlaced event, nothing else
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: publish-order-events
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: { "Fn::ImportValue": !Sub "${MessagingStackName}-TopicArn" }

  # ---- ECS --------------------------------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !FindInMap [Sizing, !Ref Env, Cpu]
      Memory: !FindInMap [Sizing, !Ref Env, Memory]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub "${Repository.RepositoryUri}:${ImageTag}"
          Essential: true
          StopTimeout: 30
          PortMappings:
            - { ContainerPort: 8080, Protocol: tcp }
          Environment:
            - { Name: APP_VERSION, Value: !Ref ImageTag }
            - { Name: AWS_DEFAULT_REGION, Value: !Ref "AWS::Region" }
            - Name: TOPIC_ARN
              Value: { "Fn::ImportValue": !Sub "${MessagingStackName}-TopicArn" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: api

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !If [HasImage, !FindInMap [Sizing, !Ref Env, Count], 0]
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets:
            - { "Fn::ImportValue": !Sub "${NetworkStackName}-PrivateSubnetA" }
            - { "Fn::ImportValue": !Sub "${NetworkStackName}-PrivateSubnetB" }
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ServiceUrl:
    Value: !Sub "http://${LoadBalancer.DNSName}/"
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  RepositoryName:
    Value: !Ref Repository
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
